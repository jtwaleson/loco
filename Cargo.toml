[workspace]

[workspace.package]
edition = "2021"
rust-version = "1.70"
license = "Apache-2.0"

[package]
name = "loco-rs"
version = "0.16.4"
description = "The one-person framework for Rust"
homepage = "https://loco.rs/"
documentation = "https://docs.rs/loco-rs"
repository = "https://github.com/loco-rs/loco"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = [
    "auth_jwt",
    "cli",
    "with-db",
    "bg_pg",
]
auth_jwt = ["dep:jsonwebtoken"]
cli = ["dep:clap"]
testing = []
with-db = [
    "dep:sea-orm",
    "dep:sqlx",
    "loco-gen/with-db",
]
bg_pg = ["dep:sqlx", "dep:ulid"]
## Testing feature flags
integration_test = []

[dependencies]
loco-gen = { version = "0.16.1" }
backtrace_printer = { version = "1.3.0" }

# cli
clap = { version = "4.4.7", features = ["derive"], optional = true }
colored = { workspace = true }
sea-orm = { version = "1.1.0", features = [
    "sqlx-postgres",        # `DATABASE_DRIVER` feature
    "runtime-tokio-rustls",
    "macros",
], optional = true }

tokio = { version = "1.45", default-features = false }
tokio-util = "0.7"
# the rest

serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
serde_variant = "0.1.2"
toml = "0.8"

async-trait = { workspace = true }

axum = { workspace = true }
axum-extra = { version = "0.10", features = ["cookie"] }
regex = { workspace = true }
# mailer
tera = { workspace = true }
heck = { workspace = true }
lettre = { version = "0.11.4", default-features = false, features = [
    "builder",
    "hostname",
    "smtp-transport",
    "tokio1-rustls-tls",
] }
include_dir = "0.7.3"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.16", default-features = false, features = [
    "env-filter",
    "json",
    "ansi",
] }
tracing-appender = { version = "0.2.3", default-features = false }

duct_sh = { version = "1.0.0" }

tower-http = { workspace = true }
byte-unit = "4.0.19"

argon2 = { version = "0.5", features = ["std"] }
rand = { version = "0.9", features = ["std"] }
jsonwebtoken = { version = "9.3.0", optional = true }
validator = { version = "0.20.0", features = ["derive"] }
futures-util = "0.3"
tower = { workspace = true }
bytes = "1.1"
ipnetwork = "0.20.0"
semver = "1"

chrono = { workspace = true }

uuid = { version = "1.10.0", features = ["v4", "fast-rng"] }

# Scheduler
tokio-cron-scheduler = { version = "0.11.0", features = ["signal"] }
english-to-cron = { version = "0.1.2" }

# bg_pg: postgres workers
sqlx = { version = "0.8.2", default-features = false, features = [
    "json",
    "postgres",
    "chrono",
], optional = true }
ulid = { version = "1", optional = true }

dashmap = "6"

[workspace.dependencies]
tera = { version = "1.19.1" }
colored = { version = "3.0" }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1.40"
regex = "1"
thiserror = "1"
serde = "1"
serde_json = "1"
async-trait = { version = "0.1.74" }
axum = { version = "0.8.1", features = ["macros", "multipart"] }
tower = "0.4"
tower-http = { version = "0.6.8", features = [
    "trace",
    "catch-panic",
    "timeout",
    "add-extension",
    "cors",
    "fs",
    "set-header",
    "compression-full",
] }
heck = "0.4.0"

[package.metadata.docs.rs]
features = ["testing"]

[dev-dependencies]
loco-rs = { path = ".", features = ["testing"] }
rstest = "0.21.0"
insta = { version = "1.34.0", features = ["redactions", "yaml", "filters"] }
tree-fs = { version = "0.3" }
reqwest = { version = "0.12.7", features = ["json"] }
tower = { workspace = true, features = ["util"] }
sqlx = { version = "0.8.2", default-features = false, features = [
    "macros",
    "json",
    "postgres",
    "chrono",
    "migrate",
] }
testcontainers = { version = "0.23.3" }
